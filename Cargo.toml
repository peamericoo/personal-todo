[package]
name = "personal-todo"
version = "0.2.0"
edition = "2021"
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
subtle = "2"
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
